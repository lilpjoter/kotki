services:
  - type: web
    name: kotki-uploader
    runtime: python
    plan: free
    rootDir: serwer
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: UPLOAD_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.6
